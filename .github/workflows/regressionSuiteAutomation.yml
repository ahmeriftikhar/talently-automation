name: Regression Testing
# Run title shows the environment so dev vs prod runs are distinguishable in the Actions list.
run-name: Regression Testing — ${{ github.event.inputs.environment || 'dev' }}

# Runs the regression suite: auth, candidates, create-jobs, dashboard, jobs, and the
# link-driven interview (interviewWithoutJobCreation). The Talently Pro interview and the
# mock-interview specs are intentionally excluded (they run in separate, longer pipelines).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to run against'
        type: choice
        options:
          - dev
          - prod
        default: dev
  #schedule:
    # Nightly at 02:00 UTC
    # - cron: '0 2 * * *'

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression E2E
    runs-on: ubuntu-latest
    # The link-driven interview self-answers to completion and can take a long time.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run Cypress regression suite
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # Chrome (not Electron) so the interview specs get the fake camera/mic launch args.
          spec: cypress/e2e/auth/**/*.cy.js,cypress/e2e/candidates/**/*.cy.js,cypress/e2e/create-jobs/**/*.cy.js,cypress/e2e/dashboard/**/*.cy.js,cypress/e2e/jobs/**/*.cy.js,cypress/e2e/interviews/interviewWithoutJobCreation.cy.js
        env:
          # Selects dev/prod URLs in cypress.config.js. Manual runs use the chosen input;
          # scheduled runs default to dev.
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          # Credentials come from GitHub Secrets (CYPRESS_* outrank cypress.env.json) — never commit prod creds.
          CYPRESS_COMPANY_EMAIL: ${{ secrets.CYPRESS_COMPANY_EMAIL }}
          CYPRESS_COMPANY_PASSWORD: ${{ secrets.CYPRESS_COMPANY_PASSWORD }}
          CYPRESS_WORKSPACE_NAME: ${{ secrets.CYPRESS_WORKSPACE_NAME }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failed-screenshots
          path: cypress/failedCasesEvidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7
