name: Interview Without Job Creation
# Run title shows the environment so dev vs prod runs are distinguishable in the Actions list.
run-name: Interview Without Job Creation — ${{ github.event.inputs.environment || 'dev' }}

# Runs the link-driven self-answering interview. Pick the target environment: dev uses the dev
# interview link, prod uses the prod interview link (the spec selects the matching link from the
# environment). Optionally override with a specific link. No company login is required — the
# candidate registers directly through the link.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - prod
        default: dev
      interviewLink:
        description: 'Interivew Link'
        required: true
        default: ''

concurrency:
  group: interview-wjc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interview:
    name: Interview Without Job Creation
    runs-on: ubuntu-latest
    # The interview self-answers each question until it completes naturally — allow plenty of time.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run interview (without job creation)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # Chrome so the interview gets the fake camera/mic launch args (Electron ignores them).
          spec: cypress/e2e/interviews/interviewWithoutJobCreation.cy.js
          # Optional link override → Cypress.env('interviewLink'). When blank, the spec falls back to
          # the dev/prod link based on the environment below.
          env: interviewLink=${{ github.event.inputs.interviewLink }}
        env:
          # Selects dev/prod URLs in cypress.config.js AND drives the spec's env-based link fallback.
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interview-failed-screenshots
          path: cypress/failedCasesEvidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-video
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload interview report JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interview-report
          path: cypress/fixtures/interviewReports
          if-no-files-found: ignore
          retention-days: 14
